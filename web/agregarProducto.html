<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width initial-scale=1.0" />
    <title>Agregar producto</title>
    <link rel="stylesheet" href="estilo.css" />
  </head>
  <body class="inicio">
    <section class="inicio-seccion">
            <div class="boton-volver">
                <input
                type="button"
                class="boton boton-borde"
                value="← Volver al menú"
                onclick="location.href='menu.html';"
                />
            </div>
            <div class="boton-volver2">
                <input type="button" class="boton boton-borde" value="← Volver" onclick="location.href='productos.html';"/>
                <h2 class="titulo-seccion">Registrar producto</h2>
            </div>
            <form class="grupo-formulario2" action="registroProducto.jsp" method="post" onsubmit="return validaRegistroProducto()">
                <div class="caja-seccion tarjeta">
                    <div class="texto-centro">
                        <p class="titulo-seccion2">Registrar Nuevo Producto</p>
                        <p class="subtitulo-seccion2">Ingresa los datos del producto que deseas agregar al inventario</p>
                    </div>

                    <div>
                        <label style="margin-top: 40px">Nombre del producto</label>
                        <input class="input-datos2" type="text" id="nombre" name="nombre"/>
                         <a id="mensajeErrorNombre" class="mensajeError"></a>
                    </div>

                    <div class="flex" style="gap: 10px">
                        <div>
                            <label>Cantidad disponible</label>
                            <input class="input-datos3" type="number" id="cantidad" name="cantidad" placeholder="0" step="1" min="0"/>
                            <a id="mensajeErrorCantidad" class="mensajeError"></a>
                        </div>

                        <div>
                            <label>Precio de costo ($)</label>
                            <input class="input-datos3" type="number" id="precio_costo" name="precio_costo" placeholder="0.00" step="0.01" min="0"/>
                            <a id="mensajeErrorPrecioCosto" class="mensajeError"></a>
                        </div>

                        <div>
                            <label>Precio de venta ($)</label>
                            <input class="input-datos3" type="number" id="precio" name="precio" placeholder="0.00" step="0.01" min="0"/>
                            <a id="mensajeErrorPrecio" class="mensajeError"></a>
                        </div>
                    </div>

                    <button class="boton boton-primario" style="margin-top: 20px" type="submit" onclick="">
                        + Agregar Producto
                    </button>
                </div>
            </form>
    </section>
    <script src="validaFormulario.js"></script>
  </body>
</html>
