<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PayStream</title>
  <link rel="stylesheet" href="estilo.css" />
  <style>
    html, body { height: 100%; overflow: hidden; }
  </style>
</head>
<body>

<div class="app-shell">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">

    <div class="sidebar-brand">
      <div class="sidebar-brand-name">PayStream</div>
      <div class="sidebar-brand-sub">por DevBiz</div>
    </div>

    <nav class="sidebar-nav">
      <span class="sidebar-label">Menú</span>

      <button class="sidebar-link active" onclick="navegar('menu.html', this)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
        </svg>
        Inicio
      </button>

      <button class="sidebar-link" onclick="navegar('productos.html', this)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
          <line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
        Inventario
      </button>

      <button class="sidebar-link" onclick="navegar('registroCompra.jsp', this)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        Ventas
      </button>

      <button class="sidebar-link" onclick="navegar('reportes.jsp', this)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6"  y1="20" x2="6"  y2="14"/>
        </svg>
        Reportes
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar">U</div>
        <span>Mi cuenta</span>
      </div>
      <button class="sidebar-link" onclick="location.href='inicioSesion.jsp'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Cerrar sesión
      </button>
    </div>

  </aside>

  <!-- ── Área de contenido ── -->
  <main class="content-area">
    <iframe
      id="contenido"
      class="marco-contenido"
      src="menu.html"
      name="contenido">
    </iframe>
  </main>

</div>

<script>
  const iframe = document.getElementById('contenido');

  iframe.addEventListener('load', () => {
    iframe.style.opacity = '1';
  });

  function navegar(url, btn) {
    iframe.style.opacity = '0';
    setTimeout(() => { iframe.src = url; }, 150);
    document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
    btn.classList.add('active');
  }
</script>

</body>
</html>
